[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "export-igorgraph"
version = "0.1.0"
description = "Turn a matplotlib figure into an Igor Pro graph (data + drawing commands in one HDF5 file)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Norifumi L. YAMADA" }]
keywords = ["igor pro", "matplotlib", "plotting", "hdf5", "wavemetrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["h5py"]
tools = ["pillow", "scipy", 'pywin32; sys_platform == "win32"']

[project.urls]
Homepage = "https://github.com/nlyamada/export-igorgraph"
Documentation = "https://github.com/nlyamada/export-igorgraph/tree/HEAD/docs/en"
Issues = "https://github.com/nlyamada/export-igorgraph/issues"
Changelog = "https://github.com/nlyamada/export-igorgraph/blob/HEAD/CHANGELOG.md"

[project.scripts]
export-igorgraph = "export_igorgraph.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
